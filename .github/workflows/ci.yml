name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint
        run: ruff check backend

      - name: Format check
        run: ruff format --check backend

      # FIXTURE_MODE=replay : les tests lisent des réponses enregistrées.
      # Aucun appel réseau, aucun crédit Parallel consommé en CI.
      - name: Test
        env:
          FIXTURE_MODE: replay
        run: pytest

  frontend:
    name: Front — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` fait déjà `tsc -b`, mais l'échec serait attribué au
      # bundler. Séparer les deux dit lequel des deux a cassé.
      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

  e2e:
    name: End to end — browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le serveur du test de bout en bout est le vrai serveur : il lui faut
      # les dépendances du backend, y compris les SDK, même si aucun appel
      # sortant n'a lieu.
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # FIXTURE_MODE=replay : les transports sortants sont scriptés depuis
      # l'arbre de tests. Aucun appel réseau, aucun crédit consommé.
      - name: Run
        working-directory: frontend
        env:
          FIXTURE_MODE: replay
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 5

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it and rotate the keys."
            exit 1
          fi
          echo "OK — no .env in the index."

      - name: Fail on obvious API keys in tracked files
        run: |
          # Le placeholder vide de .env.example ne doit jamais être rempli.
          if grep -rInE '^(PARALLEL_API_KEY|GOOGLE_API_KEY)=.+' --include='*.example' .; then
            echo "::error::A real key appears to be committed in an .example file."
            exit 1
          fi
          echo "OK — no populated keys in example files."
